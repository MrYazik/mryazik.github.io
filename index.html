<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Портфолио - MrYaz</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <h1>Алексей</h1>
            <details class="projects-type">
                <summary>Проекты</summary>
                <ul>
                    <!-- Типы проектов -->
                    <button type="button" class="project-type-button">Telegram боты</button>
                    <button type="button" class="project-type-button active">JavaFX приложения</button>
                    <button type="button" class="project-type-button">Android приложения</button>
                </ul>
            </details>
        </header>

        <main class="main">
            <div class="projects-header">
                <p class="name-type">JavaFX приложения</p>
                <h2>Избранные проекты</h2>
                <p class="projects-description">Выберите тип проекта в секции выше, чтобы увидеть готовые кейсы и ссылки на GitHub.</p>
            </div>
            <section class="projects">

            </section>
        </main>

        <div class="project-modal hidden" id="projectModal" aria-hidden="true">
            <div class="modal-backdrop" data-close-modal></div>
            <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <button class="modal-close" type="button" data-close-modal aria-label="Закрыть окно проекта">×</button>
                <div class="modal-content">
                    <div class="modal-header">
                        <span class="name-type modal-type"></span>
                        <h2 id="modalTitle"></h2>
                        <p id="modalDescription" class="modal-purpose"></p>
                    </div>
                    <div class="modal-body">
                        <div class="modal-screenshots" id="modalScreenshots"></div>
                        <div class="modal-details">
                            <div class="modal-info-block">
                                <h3>Для чего:</h3>
                                <p id="modalForWhat"></p>
                            </div>
                            <div class="modal-info-block">
                                <h3>Стек технологий:</h3>
                                <p id="modalStack"></p>
                            </div>
                            <a class="project-button modal-github" href="#" target="_blank" rel="noreferrer">View in GitHub</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Полноэкранный просмотр скриншота -->
        <div class="image-modal hidden" id="imageModal" aria-hidden="true">
            <div class="modal-backdrop" data-close-image-modal></div>
            <div class="image-modal-panel" role="dialog" aria-modal="true" aria-labelledby="imageModalTitle">
                <button class="modal-close image-modal-close" type="button" data-close-image-modal aria-label="Закрыть скриншот">×</button>
                <h2 id="imageModalTitle" class="sr-only">Просмотр скриншота</h2>
                <button class="image-modal-arrow image-modal-arrow-prev" type="button" data-image-prev aria-label="Предыдущий скриншот">‹</button>
                <img id="imageModalImage" class="image-modal-image" src="" alt="">
                <button class="image-modal-arrow image-modal-arrow-next" type="button" data-image-next aria-label="Следующий скриншот">›</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
